<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arya Tushar Bhingarde | Full Stack Developer</title>
  <meta name="description" content="Portfolio of Arya Tushar Bhingarde, aspiring full stack developer skilled in React.js, Node.js, Express.js, MongoDB, Azure, and modern web applications." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="noise"></div>
  <div id="root">
    <div class="loader-screen">
      <div class="loader-grid"></div>
      <div class="loader-card">
        <div class="loader-mark">
          <span>AB</span>
          <i class="loader-orbit loader-orbit-a"></i>
          <i class="loader-orbit loader-orbit-b"></i>
        </div>
        <p>Building Arya's portfolio</p>
        <div class="loader-track">
          <span></span>
          <b></b>
        </div>
        <div class="loader-steps">
          <span>Resume</span>
          <span>Stack</span>
          <span>Projects</span>
          <span>Ready</span>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import React, { useEffect, useMemo, useState } from "https://esm.sh/react@18.3.1";
    import { createRoot } from "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1";
    import { AnimatePresence, motion, useScroll, useSpring, useTransform } from "https://esm.sh/framer-motion@11.18.2?deps=react@18.3.1,react-dom@18.3.1";

    const e = React.createElement;

    const profile = {
      name: "Arya Tushar Bhingarde",
      role: "Full Stack Developer",
      location: "Navi Mumbai, Uran",
      phone: "+91 9769991716",
      email: "aryabhingarde9@gmail.com",
      summary: "Aspiring Full Stack Developer skilled in React.js, Node.js, Express.js, and MongoDB. Experienced in building responsive web applications, REST APIs, authentication systems, and payment integrations. Microsoft Certified in AI, security, and data fundamentals.",
      education: "B.Tech CSE, Parul University",
      period: "2023 - 2027",
      cgpa: "7.54 CGPA"
    };

    const links = [
      { label: "Email", href: "mailto:aryabhingarde9@gmail.com" },
      { label: "LinkedIn", href: "https://www.linkedin.com/in/arya-bhingarde-3bb715361/" },
      { label: "GitHub", href: "https://github.com/Aryab0705" },
      { label: "LeetCode", href: "https://leetcode.com/u/Aryab07/" }
    ];

    const metrics = [
      { value: "2+", label: "Full stack projects" },
      { value: "3", label: "Microsoft certifications" },
      { value: "7.54", label: "Current CGPA" },
      { value: "2027", label: "Graduation year" }
    ];

    const skills = [
      { group: "Languages", items: ["Java", "JavaScript"], level: 82 },
      { group: "Frontend", items: ["HTML", "CSS", "React.js", "Tailwind CSS"], level: 90 },
      { group: "Backend", items: ["Node.js", "Express.js", "REST APIs", "JWT"], level: 86 },
      { group: "Database", items: ["PostgreSQL", "MongoDB", "SQL"], level: 80 },
      { group: "Cloud", items: ["Azure AI Service", "Azure Data Service"], level: 76 },
      { group: "Tools", items: ["VS Code", "Git", "GitHub"], level: 84 },
      { group: "Core CS", items: ["DSA", "Computer Networks", "OOPs"], level: 78 }
    ];

    const projects = [
      {
        title: "Food Ordering App",
        stack: "React.js, Node.js, Express.js, MongoDB",
        accent: "fresh",
        repo: "https://github.com/Aryab0705/food-ordering-app",
        points: [
          "Built a full-stack food ordering application with authentication, cart management, and order tracking.",
          "Developed RESTful APIs for authentication, menu management, and order processing.",
          "Implemented JWT authentication, SMTP email verification, and Razorpay payment checkout.",
          "Designed responsive React interfaces and optimized MongoDB schemas for efficient data handling."
        ]
      },
      {
        title: "HomeEase",
        stack: "React.js, Node.js, Express.js, MongoDB",
        accent: "service",
        repo: "#",
        points: [
          "Built a home service marketplace connecting customers with verified service providers.",
          "Implemented JWT authentication, role-based access control, and booking workflows.",
          "Developed APIs for service listings, appointment scheduling, and booking management.",
          "Integrated Razorpay payments, automated notifications, and an AI-powered cost estimator."
        ]
      }
    ];

    const certifications = [
      "AI-900 Microsoft Certified",
      "SC-900 Microsoft Certified",
      "DP-900 Microsoft Certified",
      "Computer Network NPTEL"
    ];

    const achievements = [
      "Achieved Microsoft certifications in AI-900, SC-900, and DP-900, showing cloud, security, and data fundamentals.",
      "Led a college hackathon team and delivered a functional software prototype within the competition deadline."
    ];

    const fadeUp = {
      hidden: { opacity: 0, y: 34 },
      show: { opacity: 1, y: 0, transition: { duration: 0.72, ease: [0.22, 1, 0.36, 1] } }
    };

    const stagger = {
      hidden: {},
      show: { transition: { staggerChildren: 0.09, delayChildren: 0.1 } }
    };

    const repeatViewport = { once: false, amount: 0.28, margin: "-6% 0px -6% 0px" };

    function Icon({ name }) {
      const paths = {
        mail: "M4 6h16v12H4z M4 7l8 6 8-6",
        phone: "M7 4l3 3-2 2c1 2 3 4 5 5l2-2 3 3-2 3c-7 0-12-5-12-12z",
        map: "M12 21s7-5 7-11a7 7 0 0 0-14 0c0 6 7 11 7 11z M12 10h.01",
        arrow: "M5 12h14 M13 6l6 6-6 6",
        code: "M9 18l-6-6 6-6 M15 6l6 6-6 6",
        award: "M12 15a6 6 0 1 0 0-12 6 6 0 0 0 0 12z M9 14l-1 7 4-2 4 2-1-7",
        spark: "M12 2l1.6 6.4L20 10l-6.4 1.6L12 18l-1.6-6.4L4 10l6.4-1.6z"
      };
      return e("svg", { viewBox: "0 0 24 24", "aria-hidden": "true" }, e("path", { d: paths[name], fill: "none", stroke: "currentColor", strokeWidth: "1.8", strokeLinecap: "round", strokeLinejoin: "round" }));
    }

    function Nav() {
      const navItems = [
        { label: "Projects", href: "#projects" },
        { label: "Skills", href: "#skills" },
        { label: "Certifications", href: "#certifications" },
        { label: "Contact", href: "#contact-details" }
      ];

      return e(motion.header, { className: "nav", initial: { y: -80, opacity: 0 }, animate: { y: 0, opacity: 1 }, transition: { duration: 0.7, ease: "easeOut" } },
        e("a", { className: "brand", href: "#top", "aria-label": "Arya portfolio home" }, "AB"),
        e("nav", null, navItems.map(item =>
          e("a", { key: item.label, href: item.href }, item.label)
        ))
      );
    }

    function LoadingScreen() {
      const loadingSteps = ["Resume", "Stack", "Projects", "Ready"];
      return e(motion.div, {
        className: "loader-screen",
        initial: { opacity: 1 },
        exit: { opacity: 0, transition: { duration: 0.65, ease: "easeInOut" } }
      },
        e("div", { className: "loader-grid" }),
        e(motion.div, {
          className: "loader-card",
          initial: { opacity: 0, y: 28, scale: 0.96 },
          animate: { opacity: 1, y: 0, scale: 1 },
          exit: { y: -28, scale: 0.98, opacity: 0 },
          transition: { duration: 0.65, ease: [0.22, 1, 0.36, 1] }
        },
          e("div", { className: "loader-mark" },
            e("span", null, "AB"),
            e("i", { className: "loader-orbit loader-orbit-a" }),
            e("i", { className: "loader-orbit loader-orbit-b" })
          ),
          e("p", null, "Building Arya's portfolio"),
          e("div", { className: "loader-track" },
            e(motion.span, {
              initial: { scaleX: 0 },
              animate: { scaleX: 1 },
              transition: { duration: 2.1, ease: [0.65, 0, 0.35, 1] }
            }),
            e("b", null)
          ),
          e("div", { className: "loader-steps" }, loadingSteps.map((step, index) =>
            e(motion.span, {
              key: step,
              initial: { opacity: 0.25, y: 8 },
              animate: { opacity: [0.25, 1, 0.55], y: [8, 0, 0] },
              transition: { duration: 1.2, delay: index * 0.34, repeat: 1, repeatType: "reverse" }
            }, step)
          ))
        )
      );
    }

    function Hero() {
      const words = ["React.js", "Node.js", "MongoDB", "REST APIs", "Azure"];
      return e("section", { id: "top", className: "hero section" },
        e(motion.div, { className: "hero-copy", variants: stagger, initial: "hidden", animate: "show" },
          e(motion.p, { className: "eyebrow", variants: fadeUp }, e(Icon, { name: "spark" }), " Portfolio from resume"),
          e(motion.h1, { variants: fadeUp }, profile.name),
          e(motion.div, { className: "role-line", variants: fadeUp },
            e("span", null, profile.role),
            e("div", { className: "word-rail" }, words.map((word, index) => e("b", { key: word, style: { animationDelay: `${index * 1.4}s` } }, word)))
          ),
          e(motion.p, { className: "hero-summary", variants: fadeUp }, profile.summary),
          e(motion.div, { className: "hero-actions", variants: fadeUp },
            e("a", { className: "button primary", href: "./FullStack_resume.pdf", target: "_blank", rel: "noreferrer" }, "Hire Me", e(Icon, { name: "arrow" })),
            e("a", { className: "button ghost", href: "#projects" }, "View Work", e(Icon, { name: "code" }))
          )
        ),
        e(motion.div, { className: "hero-panel", initial: { opacity: 0, scale: 0.92, rotateX: 8 }, animate: { opacity: 1, scale: 1, rotateX: 0 }, transition: { duration: 0.9, delay: 0.25, ease: [0.22, 1, 0.36, 1] } },
          e("div", { className: "avatar-ring" },
            e("div", { className: "orbit orbit-one" }),
            e("div", { className: "orbit orbit-two" }),
            e("div", { className: "scan-line" }),
            e("span", { className: "avatar-core" }, "AB")
          ),
          e("div", { className: "terminal-card" },
            e("div", { className: "dots" }, e("span"), e("span"), e("span")),
            e("code", null, "const developer = {"),
            e("code", null, "  focus: 'full-stack web apps',"),
            e("code", null, "  stack: ['React', 'Node', 'MongoDB'],"),
            e("code", null, "  mindset: 'ship clean, useful products'"),
            e("code", null, "};")
          )
        )
      );
    }

    function ContactStrip() {
      return e(motion.section, { id: "contact-details", className: "contact-strip", variants: stagger, initial: "hidden", whileInView: "show", viewport: { ...repeatViewport, amount: 0.4 } },
        e(motion.span, { variants: fadeUp }, e(Icon, { name: "phone" }), profile.phone),
        e(motion.a, { href: "mailto:aryabhingarde9@gmail.com", variants: fadeUp }, e(Icon, { name: "mail" }), profile.email),
        e(motion.span, { variants: fadeUp }, e(Icon, { name: "map" }), profile.location)
      );
    }

    function Metrics() {
      return e("section", { className: "metrics" }, metrics.map((metric, index) =>
        e(motion.div, { className: "metric", key: metric.label, initial: { opacity: 0, y: 24 }, whileInView: { opacity: 1, y: 0 }, viewport: repeatViewport, transition: { delay: index * 0.08 } },
          e("strong", null, metric.value),
          e("span", null, metric.label)
        )
      ));
    }

    function SectionTitle({ eyebrow, title }) {
      return e(motion.div, { className: "section-title", initial: "hidden", whileInView: "show", viewport: { ...repeatViewport, amount: 0.4 }, variants: fadeUp },
        e("p", null, eyebrow),
        e("h2", null, title)
      );
    }

    function Projects() {
      return e("section", { id: "projects", className: "section projects" },
        e(SectionTitle, { eyebrow: "Selected builds", title: "Project work with real product flows" }),
        e("div", { className: "project-grid" }, projects.map((project, index) =>
          e(motion.article, { className: `project-card ${project.accent}`, key: project.title, initial: { opacity: 0, y: 42, rotateX: 8 }, whileInView: { opacity: 1, y: 0, rotateX: 0 }, viewport: repeatViewport, transition: { duration: 0.72, delay: index * 0.1 }, whileHover: { y: -10, rotate: index % 2 ? -0.7 : 0.7 } },
            e("div", { className: "project-head" },
              e("span", null, `0${index + 1}`),
              e("a", { href: project.repo, target: project.repo === "#" ? undefined : "_blank", rel: project.repo === "#" ? undefined : "noreferrer", "aria-label": `${project.title} GitHub link` }, "GitHub", e(Icon, { name: "arrow" }))
            ),
            e("h3", null, project.title),
            e("p", { className: "stack" }, project.stack),
            e("ul", null, project.points.map(point => e("li", { key: point }, point)))
          )
        ))
      );
    }

    function Skills() {
      return e("section", { id: "skills", className: "section skills" },
        e(SectionTitle, { eyebrow: "Technical toolkit", title: "Skills across the full stack" }),
        e("div", { className: "skill-grid" }, skills.map((skill, index) =>
          e(motion.article, { className: "skill-card", key: skill.group, initial: { opacity: 0, y: 28 }, whileInView: { opacity: 1, y: 0 }, viewport: repeatViewport, transition: { delay: index * 0.05 }, whileHover: { scale: 1.025 } },
            e("div", { className: "skill-top" },
              e("h3", null, skill.group),
              e("span", null, `${skill.level}%`)
            ),
            e("div", { className: "skill-bar" }, e(motion.span, { initial: { width: 0 }, whileInView: { width: `${skill.level}%` }, viewport: repeatViewport, transition: { duration: 1, delay: 0.15 } })),
            e("div", { className: "chips" }, skill.items.map(item => e("span", { key: item }, item)))
          )
        ))
      );
    }

    function Certifications() {
      return e("section", { id: "certifications", className: "section certs" },
        e(SectionTitle, { eyebrow: "Proof of learning", title: "Certifications and achievements" }),
        e("div", { className: "cert-layout" },
          e("div", { className: "cert-list" }, certifications.map((cert, index) =>
            e(motion.div, {
              className: "cert-pill",
              key: cert,
              initial: { opacity: 0, x: -32, rotateY: -14 },
              whileInView: { opacity: 1, x: 0, rotateY: 0 },
              viewport: repeatViewport,
              transition: { duration: 0.68, delay: index * 0.09, ease: [0.22, 1, 0.36, 1] },
              whileHover: { y: -8, rotate: index % 2 ? -1 : 1, scale: 1.025 }
            },
              e("span", { className: "cert-badge" }, e(Icon, { name: "award" })),
              e("span", { className: "cert-name" }, cert),
              e("span", { className: "cert-scan" })
            )
          )),
          e("div", { className: "timeline" }, achievements.map((item, index) =>
            e(motion.article, {
              key: item,
              initial: { opacity: 0, x: 34, scale: 0.96 },
              whileInView: { opacity: 1, x: 0, scale: 1 },
              viewport: repeatViewport,
              transition: { duration: 0.7, delay: index * 0.14, ease: [0.22, 1, 0.36, 1] },
              whileHover: { x: 8 }
            },
              e("span", { className: "timeline-dot" }),
              e("p", null, item)
            )
          ))
        )
      );
    }

    function Education() {
      return e("section", { className: "section education" },
        e(motion.div, { className: "education-card", initial: { opacity: 0, y: 36 }, whileInView: { opacity: 1, y: 0 }, viewport: repeatViewport, transition: { duration: 0.7 } },
          e("div", null,
            e("p", { className: "eyebrow" }, "Education"),
            e("h2", null, profile.education),
            e("p", null, "Building a strong foundation in computer science, cloud fundamentals, data structures, networks, and software engineering.")
          ),
          e("div", { className: "edu-stats" },
            e("span", null, profile.period),
            e("strong", null, profile.cgpa)
          )
        )
      );
    }

    function Contact() {
      return e("section", { id: "contact", className: "section contact" },
        e(motion.div, { className: "contact-box", initial: { opacity: 0, y: 34 }, whileInView: { opacity: 1, y: 0 }, viewport: repeatViewport, transition: { duration: 0.7 } },
          e("p", { className: "eyebrow" }, "Let's connect"),
          e("h2", null, "Ready to build responsive, secure, full-stack products."),
          e("p", null, "I enjoy turning practical ideas into clean interfaces, reliable APIs, and user-friendly product flows."),
          e("div", { className: "socials" }, links.map(link =>
            e("a", { key: link.label, href: link.href, target: link.href.startsWith("http") ? "_blank" : undefined, rel: link.href.startsWith("http") ? "noreferrer" : undefined }, link.label, e(Icon, { name: "arrow" }))
          ))
        )
      );
    }

    function App() {
      const { scrollYProgress } = useScroll();
      const scaleX = useSpring(scrollYProgress, { stiffness: 120, damping: 30, restDelta: 0.001 });
      const y = useTransform(scrollYProgress, [0, 1], [0, -120]);
      const [mouse, setMouse] = useState({ x: 0, y: 0 });
      const [isLoading, setIsLoading] = useState(true);

      useEffect(() => {
        const onMove = event => setMouse({ x: event.clientX, y: event.clientY });
        window.addEventListener("pointermove", onMove);
        return () => window.removeEventListener("pointermove", onMove);
      }, []);

      useEffect(() => {
        const timer = window.setTimeout(() => setIsLoading(false), 2450);
        return () => window.clearTimeout(timer);
      }, []);

      const cursorStyle = useMemo(() => ({ x: mouse.x - 9, y: mouse.y - 9 }), [mouse]);

      return e(React.Fragment, null,
        e(AnimatePresence, null, isLoading && e(LoadingScreen, { key: "loader" })),
        e(motion.div, { className: "progress", style: { scaleX } }),
        e(motion.div, { className: "cursor", animate: cursorStyle, transition: { type: "spring", stiffness: 500, damping: 35 } }),
        e(motion.div, { className: "grid-bg", style: { y } }),
        e(Nav),
        e("main", null,
          e(Hero),
          e(ContactStrip),
          e(Metrics),
          e(Projects),
          e(Skills),
          e(Certifications),
          e(Education),
          e(Contact)
        )
      );
    }

    createRoot(document.getElementById("root")).render(e(App));
  </script>
</body>
</html>
